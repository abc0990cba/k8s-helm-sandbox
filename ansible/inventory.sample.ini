# Copy to ansible/inventory.ini (gitignored) and fill in your real machines.
# These two groups ARE the deployment targets:  ./start lan   /   ./start vps
# App domains / TLS settings live in the chart overlays (helm-chart/values-lan.yaml,
# values-vps.yaml) — this file only carries machine facts, so there is one source of truth.

[lan]
# the Ubuntu VM in VirtualBox on the Windows machine (bridged adapter — see docs/DEPLOY-LAN-VIRTUALBOX.md)
lan-vm ansible_host=192.168.1.50 ansible_user=maxim
# §2.7 Path C (NAT + port forwards): point at the WINDOWS host and add the forwarded ssh port:
# lan-vm ansible_host=192.168.1.23 ansible_port=2222 ansible_user=maxim
# §2.7 Path B (direct cable): the VM's cable address, no port needed:
# lan-vm ansible_host=10.10.10.3 ansible_user=maxim

[orbstack]
# local rehearsal machine on this Mac — created and managed by scripts/orbstack-create.sh,
# which fills in the real IP and user below (docs/RUN.md, section OrbStack)
# k3s-orbstack ansible_host=192.168.139.195 ansible_user=ubuntu

[vps]
# rented Ubuntu 24.04 box. root works for first bootstrap; role 'common' creates the
# hardened 'deploy' user — switch ansible_user=deploy afterwards (docs/DEPLOY-VPS-ARGOCD.md)
vps-box ansible_host=203.0.113.10 ansible_user=root
