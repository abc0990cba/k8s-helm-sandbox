---
# Opt-in (keda_enabled) — installs the KEDA operator so the chart can render
# a ScaledObject that autoscales the nodejs worker on the redis `jobs` stream
# backlog. Core manifests (no admission webhooks) keep it k3s-friendly, same
# trade-off as the prometheus-operator.
- name: Apply KEDA (core manifests)
  ansible.builtin.command: >
    k3s kubectl apply
    -f https://github.com/kedacore/keda/releases/download/{{ keda_version }}/keda-{{ keda_version | replace('v', '') }}-core.yaml
  register: keda_apply
  changed_when: "'unchanged' not in keda_apply.stdout"

- name: Wait for the KEDA operator
  ansible.builtin.command: >
    k3s kubectl -n keda rollout status deployment/keda-operator --timeout=300s
  changed_when: false
