---
- name: Install k3s (single node; Traefik disabled — the chart wants ingress-nginx)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -s - server \
      --disable traefik \
      --write-kubeconfig-mode 600
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"

- name: Wait for the node to be Ready
  # kubectl wait instead of a jsonpath filter: ansible's command module
  # shlex-strips the quotes from a jsonpath string literal, which kubectl
  # (v1.34+ jsonpath parser) then rejects as "unrecognized identifier"
  ansible.builtin.command: >
    k3s kubectl wait --for=condition=Ready node/{{ ansible_hostname }} --timeout=600s
  changed_when: false

- name: Read the kubeconfig (server stays 127.0.0.1:6443 — scripts reach it via an SSH tunnel)
  ansible.builtin.command: cat /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  changed_when: false

- name: Store the kubeconfig on the controller
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig.stdout }}\n"
    # named after the TARGET (group), not the inventory host — scripts/remote-env.sh
    # looks for .local/kubeconfig-<target>.raw.yaml (orbstack|lan|vps)
    dest: "{{ playbook_dir }}/../.local/kubeconfig-{{ (group_names | intersect(['orbstack', 'lan', 'vps']))[0] | default(inventory_hostname) }}.raw.yaml"
    mode: "600"
  delegate_to: localhost
  become: false
