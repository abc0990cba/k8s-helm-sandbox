# vars for every remote target
repo_url: "https://github.com/abc0990cba/k8s-helm-sandbox.git"
repo_branch: "main"

# pinned upstream versions — bump deliberately, not by accident
k3s_channel: "stable"
ingress_nginx_tag: "controller-v1.12.1"
cert_manager_version: "v1.16.2"
argocd_version: "v2.13.3"
helm_version: "v3.16.4"
sops_version: "v3.9.1"
helm_secrets_version: "v4.6.2"

# opt-in advanced tooling — each adds a controller (+ its CRDs) to the target.
# Keep OFF unless the matching chart toggle is on:
#   rollouts_enabled → rustBack.rollout.enabled (canary for rust-back)
#   keda_enabled     → keda.enabled             (worker scales on the jobs stream)
#   chaos_mesh_enabled → docs/CHAOS.md experiments
rollouts_enabled: false
keda_enabled: false
chaos_mesh_enabled: false
rollouts_version: "v1.7.2"
keda_version: "v2.16.1"
chaos_mesh_chart_version: "2.7.2"

# hardened sudo user created by the common role (no-lockout: pubkey is installed first)
deploy_user: "deploy"
