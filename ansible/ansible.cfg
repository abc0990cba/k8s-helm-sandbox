[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = accept-new
interpreter_python = auto_silent
retry_files_enabled = False
# the roles' shell tasks use `set -o pipefail` — ansible's shell module
# defaults to /bin/sh (dash on Ubuntu), which rejects it
executable = /bin/bash

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ServerAliveInterval=30
