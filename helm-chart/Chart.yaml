apiVersion: v2
name: bona-helm
description: The demo stack — react front, nodejs+golang backends behind KrakenD, Keycloak, Postgres, Redis — as one chart

type: application

# bump per chart change; the release name stays "ap" (AGENTS.md: load-bearing)
version: 0.2.0

# reflects the react-front image lineage (VITE_*-baked SPA), not the chart
appVersion: "0.3.6"

# stateless workloads carry securityContext/PDB/strategy semantics that assume
# the API surface and features of these versions
kubeVersion: ">=1.25.0-0"

dependencies:
- name: kube-prometheus-stack
  repository: https://prometheus-community.github.io/helm-charts/
  version: 65.3.2
  condition: metrics.enabled
