environment: prod

# production-hardening toggles — flip any off to fall back to the pre-hardening
# behaviour (useful while debugging: netpol is the usual suspect)
hardening:
  securityContext: true   # runAsNonRoot / seccomp RuntimeDefault / drop caps / no SA token automount
  pdb: true               # PodDisruptionBudgets (maxUnavailable 1) for the stateless workloads
  netpol: true            # the full NetworkPolicy set (was: postgres+redis ingress only)

loadGenerator:
  enable: false
  name: load-generator
  # digest-pinned busybox (same pin as the backup cleaner cronjob)
  image: busybox@sha256:ba76950ac9eaa407512c9d859cea48114eeff8a6f12ebaa5d32ce79d4a017dd8
  components: load
  replicas: 20
  targets:
    # hit the public fibonacci through BOTH paths: straight at nodejs (HPA
    # stress) and through the gateway at golang
    - "http://{{ .Values.nodejsBack.name }}-clusterip:{{ .Values.nodejsBack.servicePort }}/fibonacci"
    - "http://{{ .Values.gateway.name }}-clusterip:{{ .Values.gateway.servicePort }}/v1/golang/public/fibonacci/10"

metrics:
  enabled: false

# kube-prometheus-stack footprint tuning — values are keyed by the subchart's
# real name; metrics.enabled above is just the install gate. Trimmed so the
# stack co-exists with the app on one small node (k3s: the embedded control
# plane components have no scrape targets, so they're switched off entirely)
kube-prometheus-stack:
  alertmanager:
    enabled: false   # rules still fire in the Prometheus UI; no routing needed here
  # gitops-friendly: no admission webhooks (they need certs + jobs that fight
  # declarative sync); CRD schema validation happens helm-side. 65.x gates the
  # webhook itself under prometheusOperator.admissionWebhooks
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  prometheusOperator:
    admissionWebhooks:
      enabled: false
  coreDns:
    enabled: false   # (camelCase!) would need a kube-system destination permission for one scrape
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeDns:
    enabled: false
  prometheus:
    prometheusSpec:
      retention: 2h
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      # scrape every ServiceMonitor in the namespace, not just helm-release-labeled ones
      serviceMonitorSelectorNilUsesHelmValues: false
  grafana:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 256Mi

namespace: default

host:
  auth: auth.test
  app: grogu.test
  prometheus: prom.test
  grafana: grafana.test
  # scheme used in browser-facing URLs: Keycloak redirect URIs (realm-export),
  # KrakenD CORS and the react-front env vars — flip to https together with tls.enabled
  scheme: http

# TLS terminates at the ingress-nginx controller. Requires cert-manager in the
# cluster (ansible roles: cert_manager) and a reachable Let's Encrypt endpoint.
tls:
  enabled: false
  clusterIssuer: letsencrypt-prod
  email: ""   # Let's Encrypt account email — the ClusterIssuer renders only when set

gateway:
  name: krakend-gateway
  image: devopsfaith/krakend
  version: "2.9.4"
  components: gateway
  servicePort: 8787
  containerPort: 8080
  metricsTargetPort: 9090
  replicas: 2
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "400m"

front:
  name: react-front
  image: mmko67/grogu-front
  version: 0.3.6
  components: front
  servicePort: 9071
  containerPort: 8080
  replicas: 1
  # requests must exist for meaningful scheduling; cpu/memory sized for the SPA preview server
  requests:
    memory: "48Mi"
    cpu: "30m"
  limits:
    memory: "128Mi"
    cpu: "100m"

nodejsBack:
  name: nodejs-back
  image: mmko67/grogu-api
  version: 0.1.6
  components: back
  stack: nodejs
  servicePort: 9070
  containerPort: 8080
  replicas: 1
  # the CPU request is what makes the HPA's utilization target computable —
  # without it the HPA renders but never scales
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "500Mi"
    cpu: "200m"

golangBack:
  name: golang-back
  image: mmko67/golang-back
  version: 0.0.8
  components: back
  stack: golang
  servicePort: 8800
  containerPort: 8081
  replicas: 1
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "500Mi"
    cpu: "200m"

# the async-jobs consumer — same image as nodejsBack, queue entrypoint
# (src/worker.js); scales independently of the API
nodejsWorker:
  name: nodejs-worker
  components: back
  stack: worker
  replicas: 1
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

auth:
  name: keycloak-auth
  image: quay.io/keycloak/keycloak
  version: "26.8.0"
  components: auth
  servicePort: 8080
  containerPort: 8080
  # health/metrics management port (Keycloak 25+ `--health-enabled`/`--metrics-enabled`)
  managementPort: 9000
  jwkUrl: http://keycloak-auth-clusterip:8080/realms/demorealm/protocol/openid-connect/certs
  alg: RS256
  replicas: 1
  # false (default): Keycloak `start` in production mode — hostname/http derived
  # from host.scheme/host.auth, health+metrics on the management port.
  # true: legacy `start-dev` (dev-only convenience, kept as the instant rollback).
  devMode: false
  realm:
    file:
      name: realm-export
  # demo user imported with the realm on first Keycloak start
  seedUser:
    username: demo
    password: demo
    email: demo@example.test
    firstName: Demo
    lastName: User
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "800Mi"
    cpu: "400m"

postgres:
  name: postgres
  image: postgres
  version: "17.6-alpine"
  components: postgres
  servicePort: 5432
  containerPort: 5432
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"
  migration:
    name: postgres-migration
    # the latest migration file; bump when adding migrations/migration-N.sql —
    # the new Job name is what triggers the run (ArgoCD/helm both understand it)
    version: 2
    components: migration
  # nightly aggregation of notes per owner into daily_reports
  reportSchedule: "@daily"

redis:
  name: redis-cache
  image: redis
  version: "7.4-alpine"
  components: cache
  containerPort: 6379
  servicePort: 6379
  storage: 400Mi
