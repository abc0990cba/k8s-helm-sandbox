# OrbStack overlay — a real Ubuntu machine on this Mac (OrbStack), driven by
# the same Ansible + ArgoCD pipeline as lan/vps (docs/RUN.md, section OrbStack).
# Same *.test names as local Minikube and the lan VM: only the hosts-file
# mapping changes (or nothing at all — smoke tests use curl --resolve).
# Applied by the ArgoCD Application gitops/apps/orbstack/ap.yaml via
# `./start orbstack`; values match chart defaults and are listed explicitly
# so this file alone describes the environment.
host:
  scheme: http
  app: grogu.test
  auth: auth.test
  prometheus: prom.test
  grafana: grafana.test

# image state for THIS environment — the CI pipeline (Gitea Actions) bumps
# image/version here per git-SHA; the shared values.yaml stays environment-neutral
front:
  image: 192.168.139.195:30500/grogu-front
  version: e7628a86d720728aa03080d0c8da79689cfdac4f
nodejsBack:
  image: 192.168.139.195:30500/grogu-api
  version: e7628a86d720728aa03080d0c8da79689cfdac4f
golangBack:
  image: 192.168.139.195:30500/golang-back
  version: d6c0378c7b4e8af9b7efbc1df4d871229c481593
# placeholder until the first CI build pushes the rust image and bumps this
# block itself (same awk block-bump as the other services)
rustBack:
  image: 192.168.139.195:30500/rust-back
  version: e7628a86d720728aa03080d0c8da79689cfdac4f

tls:
  enabled: false   # to rehearse the vps TLS branch: build values with sslip.io
                   # domains + tls.email, set true, flip tls_enabled in
                   # ansible/group_vars/orbstack.yml

metrics:
  enabled: true    # kube-prometheus-stack, trimmed by the kube-prometheus-stack
                   # values block in values.yaml (~1.5 Gi on top of the ~5 Gi app
                   # stack — fits the 8 GB machine next to 3.5 Gi headroom)
