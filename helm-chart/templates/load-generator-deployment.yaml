{{- if .Values.loadGenerator.enable }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.loadGenerator.name }}-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.loadGenerator.components }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.loadGenerator.components }}
  replicas: {{ .Values.loadGenerator.replicas }}
  template:
    metadata:
      name: {{ .Values.loadGenerator.name }}
      labels:
        app: {{ .Values.loadGenerator.components }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: {{ .Values.loadGenerator.name }}
        image: "{{ .Values.loadGenerator.image }}"
        # one tight wget loop per target (targets are values-templated so they
        # follow the chart's service names/ports) — this is the HPA's CPU fuel
        command:
        - /bin/sh
        - -c
        - |
          {{- range .Values.loadGenerator.targets }}
          while true; do wget -q -O- {{ tpl . $ }} >/dev/null 2>&1 || true; done &
          {{- end }}
          wait
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
{{- end }}
