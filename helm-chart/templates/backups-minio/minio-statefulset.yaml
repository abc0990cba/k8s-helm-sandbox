{{- if .Values.backups.minio.enabled }}
# single-tenant MinIO — the in-cluster S3 target for the backup story. One
# replica + one PVC: this is a backup SINK, not a storage service; losing it
# costs nothing (the next mc mirror refills it from the dumps PVC).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.backups.minio.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.backups.minio.name }}
spec:
  serviceName: {{ .Values.backups.minio.name }}-clusterip
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.backups.minio.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.backups.minio.name }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.hardening.securityContext }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: {{ .Values.backups.minio.name }}
          image: "{{ .Values.backups.minio.image }}:{{ .Values.backups.minio.version }}"
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":{{ .Values.backups.minio.consolePort }}"]
          {{- if .Values.hardening.securityContext }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.backups.minio.name }}-secret
          ports:
            - containerPort: {{ .Values.backups.minio.servicePort }}
            - containerPort: {{ .Values.backups.minio.consolePort }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ .Values.backups.minio.servicePort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.backups.minio.servicePort }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.backups.minio.storage }}
{{- end }}
