{{- if .Values.backups.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backups.minio.name }}-clusterip
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.backups.minio.name }}
spec:
  type: ClusterIP
  ports:
  - name: api
    port: {{ .Values.backups.minio.servicePort }}
    targetPort: {{ .Values.backups.minio.servicePort }}
    protocol: TCP
  - name: console
    port: {{ .Values.backups.minio.consolePort }}
    targetPort: {{ .Values.backups.minio.consolePort }}
    protocol: TCP
  selector:
    app: {{ .Values.backups.minio.name }}
{{- end }}
