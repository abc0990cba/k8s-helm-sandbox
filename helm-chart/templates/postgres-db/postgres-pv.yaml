apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.postgres.name }}-volume
  namespace: {{ .Values.namespace }}
  labels:
    type: local
    app: {{ .Values.postgres.components }}
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /data/postgresql
    # create the dir on a fresh node; without it the pod fails with
    # "stat /data/postgresql: no such file or directory"
    type: DirectoryOrCreate