{{- if .Values.tls.enabled }}
# Let's Encrypt issuer — requires cert-manager (ansible role: cert_manager).
# First cert issues while the ingress host is reachable over port 80 (HTTP-01);
# renewals are automatic. For staging/rate-limit testing swap the server URL
# for https://acme-staging-v02.api.letsencrypt.org/directory.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.tls.clusterIssuer }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ required "tls.email must be set when tls.enabled=true (Let's Encrypt account email)" .Values.tls.email }}
    privateKeySecretRef:
      name: {{ .Values.tls.clusterIssuer }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
{{- end }}
