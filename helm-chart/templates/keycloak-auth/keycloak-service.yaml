apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.auth.name }}-clusterip
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.auth.servicePort }}
      targetPort: {{ .Values.auth.containerPort }}
    {{- if and .Values.metrics.enabled (not .Values.auth.devMode) }}
    # management interface (health + metrics) — scraped by the ServiceMonitor
    - name: management
      port: {{ .Values.auth.managementPort }}
      targetPort: {{ .Values.auth.managementPort }}
    {{- end }}
  selector:
    app: {{ .Values.auth.components }}
