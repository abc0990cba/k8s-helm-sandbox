apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.auth.name }}-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.auth.components }}
  template:
    metadata:
      labels:
        app: {{ .Values.auth.components }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/keycloak-auth/keycloak-configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        {{- include "wait-for-postgres-db" . | indent 8}}
      containers:
        - name: {{ .Values.auth.name }}
          image: "{{ .Values.auth.image }}:{{ .Values.auth.version }}"
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.name }}-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.name }}-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
            # Keycloak 25 (Quarkus) ignores the legacy WildFly DB_* vars; these are the supported ones
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: {{ .Values.postgres.name }}-clusterip
            - name: KC_DB_URL_PORT
              value: {{ .Values.postgres.servicePort | quote }}
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-secret
                  key: POSTGRES_DB
            - name: KC_DB_SCHEMA
              value: "public"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-secret
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-secret
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: {{ .Values.auth.containerPort }}
          resources:
            limits: {{ .Values.auth.limits | toYaml | nindent 16 }}
          volumeMounts:
            - name: {{ .Values.auth.realm.file.name }}-volume
              mountPath: "/opt/keycloak/data/import"
          readinessProbe:
            httpGet:
              path: /realms/master
              port: {{ .Values.auth.containerPort }}
      volumes:
        - name: {{ .Values.auth.realm.file.name }}-volume
          configMap:
            name: {{ .Values.auth.name }}-configmap
            items:
            - key: {{ .Values.auth.realm.file.name }}.json
              path: {{ .Values.auth.realm.file.name }}.json 