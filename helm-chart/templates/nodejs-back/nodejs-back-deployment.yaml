apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nodejsBack.name }}-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.nodejsBack.components }}
    stack: {{ .Values.nodejsBack.stack }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.nodejsBack.components }}
      stack: {{ .Values.nodejsBack.stack }}
  replicas: {{ .Values.nodejsBack.replicas }}
  # zero-downtime rollouts (the HPA needs cpu requests below to be able to scale at all)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ .Values.nodejsBack.components }}
        stack: {{ .Values.nodejsBack.stack }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.hardening.securityContext }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      initContainers:
        {{- include "wait-for-postgres-db" . | indent 8}}
        {{- include "wait-for-redis-cache" . | indent 8}}
      containers:
      - name: {{ .Values.nodejsBack.name }}
        image: "{{ .Values.nodejsBack.image }}:{{ .Values.nodejsBack.version }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.nodejsBack.containerPort }}
        {{- if .Values.hardening.securityContext }}
        # 65532 = the nonroot uid of the distroless runtime stage
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        {{- end }}
        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.nodejsBack.containerPort }}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.nodejsBack.containerPort }}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: {{ .Values.nodejsBack.requests | toYaml | nindent 12 }}
          limits: {{ .Values.nodejsBack.limits | toYaml | nindent 12 }}
        envFrom:
            - secretRef:
                name: {{ .Values.postgres.name }}-secret
        env:
        - name: PORT
          value: {{ .Values.nodejsBack.containerPort | quote }}
        - name: POSTGRES_PORT
          value: {{ .Values.postgres.servicePort | quote }}
        - name: POSTGRES_HOST
          value: "{{ .Values.postgres.name }}-clusterip"
        - name: REDIS_HOST
          value: "{{ .Values.redis.name }}-clusterip"
        - name: REDIS_PORT
          value: {{ .Values.redis.servicePort | quote }}
