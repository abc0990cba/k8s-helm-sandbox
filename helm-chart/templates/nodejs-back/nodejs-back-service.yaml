apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nodejsBack.name }}-clusterip
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.nodejsBack.components }}
    stack: {{ .Values.nodejsBack.stack }}
spec:
  type: ClusterIP
  ports:
  # one port serves both the API and /metrics (prom-client on the same server);
  # the ServiceMonitor (metrics-enabled) targets this port by name
  - name: http
    port: {{ .Values.nodejsBack.servicePort }}
    targetPort: {{ .Values.nodejsBack.containerPort }}
    protocol: TCP
  selector:
    app: {{ .Values.nodejsBack.components }}
    stack: {{ .Values.nodejsBack.stack }}
