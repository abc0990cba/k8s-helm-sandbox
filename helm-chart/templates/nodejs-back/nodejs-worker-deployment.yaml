apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nodejsWorker.name }}-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.nodejsWorker.components }}
    stack: {{ .Values.nodejsWorker.stack }}
spec:
  replicas: {{ .Values.nodejsWorker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Values.nodejsWorker.components }}
      stack: {{ .Values.nodejsWorker.stack }}
  template:
    metadata:
      labels:
        app: {{ .Values.nodejsWorker.components }}
        stack: {{ .Values.nodejsWorker.stack }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.hardening.securityContext }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      initContainers:
        {{- include "wait-for-postgres-db" . | indent 8}}
        {{- include "wait-for-redis-cache" . | indent 8}}
      containers:
      - name: {{ .Values.nodejsWorker.name }}
        image: "{{ .Values.nodejsBack.image }}:{{ .Values.nodejsBack.version }}"
        imagePullPolicy: IfNotPresent
        # same image as the API — only the entrypoint differs (queue consumer)
        command: ["/usr/bin/node", "src/worker.js"]
        {{- if .Values.hardening.securityContext }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        {{- end }}
        resources:
          requests: {{ .Values.nodejsWorker.requests | toYaml | nindent 12 }}
          limits: {{ .Values.nodejsWorker.limits | toYaml | nindent 12 }}
        envFrom:
            - secretRef:
                name: {{ .Values.postgres.name }}-secret
        env:
        - name: POSTGRES_PORT
          value: {{ .Values.postgres.servicePort | quote }}
        - name: POSTGRES_HOST
          value: "{{ .Values.postgres.name }}-clusterip"
        - name: REDIS_HOST
          value: "{{ .Values.redis.name }}-clusterip"
        - name: REDIS_PORT
          value: {{ .Values.redis.servicePort | quote }}
