{{- if .Values.metrics.enabled }}
# only rendered when the prometheus-operator subchart (which owns the
# ServiceMonitor CRD) is installed; otherwise helm install fails on the CRD
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.nodejsBack.name }}-service-monitor
  namespace: default
  labels:
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.nodejsBack.components }}
  endpoints:
  - port: http-metrics
    interval: 10s
    path: /metrics
{{- end }}