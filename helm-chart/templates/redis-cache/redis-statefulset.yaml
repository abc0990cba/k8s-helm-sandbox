apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.redis.components }}
spec:
  # was a Deployment (the long-standing README TODO); a StatefulSet is the
  # honest shape for a stateful cache — stable identity + its own PVC
  serviceName: {{ .Values.redis.name }}-clusterip
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.redis.components }}
  template:
    metadata:
      labels:
        app: {{ .Values.redis.components }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.hardening.securityContext }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: {{ .Values.redis.name }}
          image: "{{ .Values.redis.image }}:{{ .Values.redis.version }}"
          imagePullPolicy: IfNotPresent
          # no hardening securityContext here on purpose: the official image's
          # entrypoint chowns /data and drops to the `redis` user itself, which
          # needs root + CAP_CHOWN at start
          args: ['/usr/local/etc/redis/redis.conf']
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis/redis.conf
              readOnly: true
              subPath: redis.conf
            - name: redis-persistent-storage
              mountPath: /data/redis
          ports:
            - containerPort: {{ .Values.redis.containerPort }}
          resources:
            limits:
              cpu: '1000m'
              memory: '2000Mi'
            # modest request so the chart fits a small (Docker Desktop) node; limit unchanged
            requests:
              cpu: '250m'
              memory: '256Mi'
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            defaultMode: 0666
            name: {{ .Values.redis.name }}-configmap
  volumeClaimTemplates:
    - metadata:
        name: redis-persistent-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
