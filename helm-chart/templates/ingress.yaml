apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: 'true'
    {{- if .Values.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    {{- if .Values.metrics.enabled }}
    - host: {{ .Values.host.prometheus }}
      http:
        paths:
          - path: /?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Release.Name }}-kube-prometheus-stack-prometheus
                port:
                  number: 9090
    - host: {{ .Values.host.grafana }}
      http:
        paths:
          - path: /?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Release.Name }}-grafana
                port:
                  number: 80
    {{- end }}
    - host: {{ .Values.host.auth }}
      http:
        paths:
          - path: /?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.auth.name }}-clusterip
                port:
                  number: {{ .Values.auth.servicePort }}
    - host: {{ .Values.host.app }}
      http:
        paths:
          - path: /api/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.gateway.name }}-clusterip
                port:
                  number: {{ .Values.gateway.servicePort }}
          - path: /?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.front.name }}-clusterip
                port:
                  number: {{ .Values.front.servicePort }}
    {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host.app }}
        - {{ .Values.host.auth }}
        {{- if .Values.metrics.enabled }}
        - {{ .Values.host.prometheus }}
        - {{ .Values.host.grafana }}
        {{- end }}
      secretName: {{ .Release.Name }}-ingress-tls
    {{- end }}