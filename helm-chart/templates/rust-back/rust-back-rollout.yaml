{{- if .Values.rustBack.rollout.enabled }}
# Progressive delivery for rust-back: replaces the Deployment (same pod
# template) with a canary Rollout. Replica-ratio canary (no trafficRouting) —
# new pods join the same Service, so the traffic split follows pod counts.
# The AnalysisTemplate gates the final 100% step on the stream consumer
# staying healthy (errors ~0, no crashloops) — needs metrics.enabled.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.rustBack.name }}-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.rustBack.components }}
    stack: {{ .Values.rustBack.stack }}
spec:
  replicas: {{ .Values.rustBack.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{ .Values.rustBack.components }}
      stack: {{ .Values.rustBack.stack }}
  strategy:
    canary:
      # single-replica DuckDB can't canary; raise rustBack.replicas first
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause: { duration: 1m }
        - setWeight: 50
        - pause: { duration: 2m }
        - analysis:
            templates:
              - templateName: {{ .Values.rustBack.name }}-canary
        - setWeight: 100
  template:
    metadata:
      labels:
        app: {{ .Values.rustBack.components }}
        stack: {{ .Values.rustBack.stack }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        {{- if .Values.hardening.securityContext }}
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      initContainers:
        {{- include "wait-for-redis-cache" . | indent 8}}
      containers:
      - name: {{ .Values.rustBack.name }}
        image: "{{ .Values.rustBack.image }}:{{ .Values.rustBack.version }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.rustBack.containerPort }}
        {{- if .Values.hardening.securityContext }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        {{- end }}
        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.rustBack.containerPort }}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.rustBack.containerPort }}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: {{ .Values.rustBack.requests | toYaml | nindent 12 }}
          limits: {{ .Values.rustBack.limits | toYaml | nindent 12 }}
        volumeMounts:
        - name: analytics-data
          mountPath: /data
        env:
        - name: PORT
          value: {{ .Values.rustBack.containerPort | quote }}
        - name: DUCKDB_PATH
          value: /data/clicks.duckdb
        - name: REDIS_URL
          value: "redis://{{ .Values.redis.name }}-clusterip:{{ .Values.redis.servicePort }}"
        - name: CLICK_STREAM
          value: clicks
        - name: CONSUMER_GROUP
          value: analytics
      volumes:
      - name: analytics-data
        persistentVolumeClaim:
          claimName: {{ .Values.rustBack.name }}-pvc
{{- end }}
