{{- if .Values.metrics.enabled }}
# only rendered when the prometheus-operator subchart (which owns the
# ServiceMonitor CRD) is installed; otherwise helm install fails on the CRD
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.rustBack.name }}-service-monitor
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.rustBack.components }}
      stack: {{ .Values.rustBack.stack }}
  endpoints:
  - port: http
    interval: 10s
    path: /metrics
{{- end }}
