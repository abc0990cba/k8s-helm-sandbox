{{- if .Values.hardening.netpol }}
# The full policy set (the old two netpols only covered postgres+redis ingress
# and denied all postgres egress). Model:
#   - every workload that must be reachable gets an explicit ingress allow-list
#   - stateful services + backends also get explicit egress (default-deny)
#   - DNS egress (kube-system coredns) is granted wherever egress is restricted
#   - monitoring scraping rules render only when metrics are enabled
# Flip hardening.netpol=false to fall back to an open namespace while debugging.
#
# ingress-nginx is selected by namespace + pod labels (upstream manifest);
# kube-prometheus-stack prometheus pods carry app.kubernetes.io/name: prometheus.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.postgres.components }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # nodejs moved to libSQL in the database-per-service split — only
        # golang, keycloak and the migration/backup/report jobs may touch
        # postgres now
        - podSelector:
            matchLabels:
              app: {{ .Values.golangBack.components }}
              stack: {{ .Values.golangBack.stack }}
        - podSelector:
            matchLabels:
              app: {{ .Values.auth.components }}
        # migration Job + the pg_dumpall/report/cleaner CronJobs share this label
        - podSelector:
            matchLabels:
              app: {{ .Values.postgres.migration.components }}
      ports:
        - port: {{ .Values.postgres.containerPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.redis.components }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.nodejsBack.components }}
              stack: {{ .Values.nodejsBack.stack }}
        - podSelector:
            matchLabels:
              app: {{ .Values.golangBack.components }}
              stack: {{ .Values.golangBack.stack }}
        # the queue consumers: nodejs worker (jobs) and rust-back (clicks)
        - podSelector:
            matchLabels:
              app: {{ .Values.nodejsWorker.components }}
              stack: {{ .Values.nodejsWorker.stack }}
        - podSelector:
            matchLabels:
              app: {{ .Values.rustBack.components }}
              stack: {{ .Values.rustBack.stack }}
      ports:
        - port: {{ .Values.redis.containerPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nodejs-back-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.nodejsBack.components }}
      stack: {{ .Values.nodejsBack.stack }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.gateway.components }}
        {{- if .Values.loadGenerator.enable }}
        - podSelector:
            matchLabels:
              app: {{ .Values.loadGenerator.components }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        {{- end }}
      ports:
        - port: {{ .Values.nodejsBack.containerPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        # nodejs's own database is libSQL now — postgres is no longer reachable
        - podSelector:
            matchLabels:
              app: {{ .Values.libsql.components }}
      ports:
        - port: {{ .Values.libsql.containerPort }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.redis.components }}
      ports:
        - port: {{ .Values.redis.containerPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: golang-back-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.golangBack.components }}
      stack: {{ .Values.golangBack.stack }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.gateway.components }}
        {{- if .Values.loadGenerator.enable }}
        - podSelector:
            matchLabels:
              app: {{ .Values.loadGenerator.components }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        {{- end }}
      ports:
        - port: {{ .Values.golangBack.containerPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.postgres.components }}
      ports:
        - port: {{ .Values.postgres.containerPort }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.redis.components }}
      ports:
        - port: {{ .Values.redis.containerPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.gateway.components }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
        {{- if .Values.metrics.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        {{- end }}
      ports:
        - port: {{ .Values.gateway.containerPort }}
          protocol: TCP
        - port: {{ .Values.gateway.metricsTargetPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.nodejsBack.components }}
              stack: {{ .Values.nodejsBack.stack }}
      ports:
        - port: {{ .Values.nodejsBack.containerPort }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.golangBack.components }}
              stack: {{ .Values.golangBack.stack }}
      ports:
        - port: {{ .Values.golangBack.containerPort }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.auth.components }}
      ports:
        - port: {{ .Values.auth.containerPort }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.rustBack.components }}
              stack: {{ .Values.rustBack.stack }}
      ports:
        - port: {{ .Values.rustBack.containerPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: libsql-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.libsql.components }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # the link/jobs backend (database-per-service: libSQL is nodejs's store)
        - podSelector:
            matchLabels:
              app: {{ .Values.nodejsBack.components }}
              stack: {{ .Values.nodejsBack.stack }}
        # the queue consumer shares the nodejs image + its database
        - podSelector:
            matchLabels:
              app: {{ .Values.nodejsWorker.components }}
              stack: {{ .Values.nodejsWorker.stack }}
        # the migration Job (schema + seeds from the ConfigMap)
        - podSelector:
            matchLabels:
              app: {{ .Values.libsql.migration.components }}
      ports:
        - port: {{ .Values.libsql.containerPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rust-back-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.rustBack.components }}
      stack: {{ .Values.rustBack.stack }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.gateway.components }}
        {{- if .Values.loadGenerator.enable }}
        - podSelector:
            matchLabels:
              app: {{ .Values.loadGenerator.components }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        {{- end }}
      ports:
        - port: {{ .Values.rustBack.containerPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        # the clicks stream lives in redis — DuckDB is in-process, no DB egress
        - podSelector:
            matchLabels:
              app: {{ .Values.redis.components }}
      ports:
        - port: {{ .Values.redis.containerPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: front-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.front.components }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - port: {{ .Values.front.containerPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.auth.components }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
        - podSelector:
            matchLabels:
              app: {{ .Values.gateway.components }}
        {{- if .Values.metrics.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        {{- end }}
      ports:
        - port: {{ .Values.auth.containerPort }}
          protocol: TCP
        {{- if not .Values.auth.devMode }}
        # health/metrics management interface
        - port: {{ .Values.auth.managementPort }}
          protocol: TCP
        {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.postgres.components }}
      ports:
        - port: {{ .Values.postgres.containerPort }}
          protocol: TCP
{{- end }}
