apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ap
  namespace: argocd
  finalizers:
    # deleting the Application also deletes everything it created (PV/PVC included —
    # the Postgres data itself survives on the host at /data/postgresql)
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ap
  source:
    repoURL: git://192.168.139.195:9418/gitops-origin.git  # TEMPORARY local rehearsal — scripts/orbstack-local-git.sh
    targetRevision: main
    path: helm-chart
    plugin:
      name: helm-secrets-v1.0
      env:
        # word-split by the plugin's sh; secrets.yaml lives at the repo root
        - name: HELM_VALUES
          value: "-f ../secrets.yaml -f values-orbstack.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      # NOTE: do NOT enable ServerSideApply here — ArgoCD 2.13's structured
      # merge diff can't type newer k8s status fields (e.g. terminatingReplicas)
      # and the whole app goes Unknown with a comparison error. The monitoring
      # CRDs are applied out-of-band (scripts/monitoring-crds.sh) instead, so
      # nothing rendered needs SSA.
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
