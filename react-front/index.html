<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grogu · polyglot k8s demo</title>
    <script>
      // set the color scheme before first paint (Mantine docs pattern) —
      // stored preference wins, otherwise follow the OS
      try {
        var stored = localStorage.getItem("mantine-color-scheme-value");
        var scheme = stored === "light" || stored === "dark" ? stored : "auto";
        var dark = scheme === "dark" || (scheme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.mantineColorScheme = dark ? "dark" : "light";
      } catch (e) {}

      // keycloak-js 26 calls crypto.randomUUID() (a secure-context-only API)
      // for its state/nonce — on the plain-HTTP *.test demo origins it does
      // not exist, so polyfill it from getRandomValues (available everywhere).
      // The https target has the native implementation and skips this.
      if (window.crypto && !window.crypto.randomUUID) {
        window.crypto.randomUUID = function () {
          var b = window.crypto.getRandomValues(new Uint8Array(16));
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          var h = Array.from(b, function (x) { return x.toString(16).padStart(2, "0"); }).join("");
          return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
        };
      }

      // The realm enforces PKCE S256 on reactclient, but crypto.subtle is
      // secure-context-only — on plain-HTTP demo origins PKCE login would be
      // impossible. Minimal SHA-256 (FIPS 180-4) exposing just digest().
      // https targets keep the native implementation.
      if (window.crypto && !window.crypto.subtle) {
        (function () {
          var rotr = function (x, n) { return (x >>> n) | (x << (32 - n)); };
          var H, K;
          (function () {
            var primes = [], n = 2;
            while (primes.length < 64) {
              var ok = true;
              for (var i = 0; i < primes.length && primes[i] * primes[i] <= n; i++)
                if (n % primes[i] === 0) { ok = false; break; }
              if (ok) primes.push(n);
              n++;
            }
            H = primes.slice(0, 8).map(function (p) { return Math.floor(Math.sqrt(p) * Math.pow(2, 32)); });
            K = primes.map(function (p) { return Math.floor(Math.cbrt(p) * Math.pow(2, 32)); });
          })();
          var sha256 = function (bytes) {
            var l = bytes.length;
            var padded = new Uint8Array((((l + 8) >> 6) << 6) + 64);
            padded.set(bytes);
            padded[l] = 0x80;
            var dv = new DataView(padded.buffer);
            var bitLen = l * 8;
            dv.setUint32(padded.length - 8, Math.floor(bitLen / 0x100000000));
            dv.setUint32(padded.length - 4, bitLen >>> 0);
            var h = H.slice();
            var w = new Array(64);
            for (var off = 0; off < padded.length; off += 64) {
              var i;
              for (i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
              for (i = 16; i < 64; i++) {
                var s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                var s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
              }
              var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
              for (i = 0; i < 64; i++) {
                var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                var ch = (e & f) ^ (~e & g);
                var t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
                var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                var mj = (a & b) ^ (a & c) ^ (b & c);
                var t2 = (S0 + mj) | 0;
                hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
              }
              h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
              h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
            }
            var out = new Uint8Array(32);
            var odv = new DataView(out.buffer);
            for (var j = 0; j < 8; j++) odv.setUint32(j * 4, h[j] >>> 0);
            return out;
          };
          window.crypto.subtle = {
            digest: function (algo, data) {
              return Promise.resolve(sha256(new Uint8Array(data)).buffer);
            },
          };
        })();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
