# CI pipeline for the orbstack target — builds changed services, records their
# image tags, and mirrors main to the repo ArgoCD watches.
#
# The SAME file runs in both GitOps modes (scripts/orbstack-mode.sh local|github
# moves it between .gitea/workflows/ and .github/workflows/ and rewrites the
# marked env lines below):
#   local   Gitea Actions (act_runner on the Mac) -> in-machine registry
#           192.168.139.195:30500, mirror to the in-machine git daemon repo.
#   github  GitHub Actions -> Docker Hub, push back to GitHub. The shape
#           lan/vps already use.
#
# No external actions are used on purpose: the job clones the repo with plain
# git, so the pipeline works fully offline in local mode.

name: build-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # ---- mode-dependent block: rewritten by scripts/orbstack-mode.sh ----------
  MODE: local                         # local | github
  REGISTRY: 192.168.139.195:30500     # local: in-machine registry | github: docker.io/<hub-user>
  GIT_HOST: host.orb.internal:3000    # local: Gitea as seen from job containers
  REPO: ci-admin/k8s-helm-sandbox     # local: Gitea slug (orbstack-gitea.sh) | github: owner/repo
  # ---- end mode-dependent block ---------------------------------------------
  # secrets — local:  CIGITCREDS = "ci-admin:<password>" (scripts/orbstack-gitea.sh)
  #           github: GH_PAT (fine-grained, contents read+write),
  #                   DOCKERHUB_USER + DOCKERHUB_TOKEN (push access to the repo)

jobs:
  build-deploy:
    runs-on: docker                   # MODE-dependent: docker (Gitea runner) | ubuntu-latest (GitHub)
    steps:
      - name: Checkout
        env:
          GITEA_CREDS: ${{ secrets.CIGITCREDS }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ "$MODE" = github ]; then
            [ -n "$GH_PAT" ] || { echo "GH_PAT is EMPTY (add it as a repo Actions secret)"; exit 1; }
            git clone "https://${GH_PAT}@github.com/${REPO}.git" .
          else
            [ -n "$GITEA_CREDS" ] || { echo "CIGITCREDS is EMPTY (scripts/orbstack-gitea.sh creates it)"; exit 1; }
            git clone "http://${GITEA_CREDS}@${GIT_HOST}/${REPO}.git" .
          fi
          git log --oneline -3

      - name: Chart checks (render matrix — runs on every commit)
        run: |
          # the chart is STREAMED in via stdin tar: -v mounts would resolve
          # against the docker daemon's filesystem (the Mac), not this job
          # container's $PWD — mount-free is the only thing that works here
          # (helm lint would fail on the ONE known error (.Values.database.name
          # lives only in secrets.yaml — AGENTS.md); the real gate is that all
          # four renders succeed and lan stays identical to defaults)
          tar --exclude='._*' -cf - helm-chart | docker run --rm -i --entrypoint /bin/sh alpine/helm:3.16.4 -c '
            mkdir -p /work && tar -C /work -xf -
            set -e
            SECRETS="--set database.name=x --set database.user=x --set database.password=x --set keycloak.adminName=admin --set keycloak.adminPassword=admin"
            helm template ap /work/helm-chart $SECRETS > /tmp/defaults.yaml
            helm template ap /work/helm-chart $SECRETS -f /work/helm-chart/values-lan.yaml > /tmp/lan.yaml
            diff /tmp/defaults.yaml /tmp/lan.yaml
            helm template ap /work/helm-chart $SECRETS -f /work/helm-chart/values-orbstack.yaml > /dev/null
            helm template ap /work/helm-chart $SECRETS -f /work/helm-chart/values-vps.yaml --set tls.email=t@e.st | grep -q ClusterIssuer
            echo "chart renders OK (defaults, lan==defaults, orbstack, vps+tls)"
          '

      - name: Detect changed services
        run: |
          SERVICES=""
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD^ HEAD || true)
            echo "$FILES" | grep -qE '^react-front/' && SERVICES="$SERVICES react-front"
            echo "$FILES" | grep -qE '^nodejs-back/' && SERVICES="$SERVICES nodejs-back"
            echo "$FILES" | grep -qE '^golang-back/' && SERVICES="$SERVICES golang-back"
            echo "$FILES" | grep -qE '^rust-back/' && SERVICES="$SERVICES rust-back"
          else
            SERVICES="react-front nodejs-back golang-back rust-back"
          fi
          echo "SERVICES=$SERVICES" >> "$GITHUB_ENV"
          echo "services to build:${SERVICES:- none}"

      - name: Test changed services (gate — no tests, no push)
        if: env.SERVICES != ''
        run: |
          set -e
          # each service tests inside its pinned toolchain container; the tree
          # is STREAMED in via stdin tar (mount-free — see the chart-checks
          # note: -v resolves on the daemon, not this container). The CI
          # checkout is clean, so no host node_modules can leak in.
          for SVC in $SERVICES; do
            echo "::group::test $SVC"
            case $SVC in
              nodejs-back)
                tar --exclude='._*' -C nodejs-back -cf - . | docker run --rm -i node:22 \
                  sh -c "mkdir -p /work && tar -C /work -xf - && cd /work && npm ci --no-audit --no-fund && npm test" ;;
              golang-back)
                tar --exclude='._*' -C golang-back -cf - . | docker run --rm -i golang:1.25 \
                  sh -c "mkdir -p /work && tar -C /work -xf - && cd /work && go vet ./... && go test ./..." ;;
              react-front)
                tar --exclude='._*' -C react-front -cf - . | docker run --rm -i node:22 \
                  sh -c "mkdir -p /work && tar -C /work -xf - && cd /work && rm -f package-lock.json && npm install --no-audit --no-fund && npx tsc -b && npx vitest run" ;;
              rust-back)
                tar --exclude='._*' --exclude='target' -C rust-back -cf - . | docker run --rm -i rust:1 \
                  sh -c "mkdir -p /work && tar -C /work -xf - && cd /work && rustup component add clippy && cargo clippy --all-targets -- -D warnings && cargo test" ;;
            esac
            echo "::endgroup::"
          done

      - name: Build and push changed images
        if: env.SERVICES != ''
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$MODE" = github ]; then
            [ -n "$DOCKERHUB_USER" ] || { echo "DOCKERHUB_USER/DOCKERHUB_TOKEN are EMPTY"; exit 1; }
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
          fi
          for SVC in $SERVICES; do
            case $SVC in
              react-front) IMAGE=grogu-front ;;
              nodejs-back) IMAGE=grogu-api ;;
              golang-back) IMAGE=golang-back ;;
              rust-back)   IMAGE=rust-back ;;
            esac
            echo "::group::build $IMAGE"
            docker build -t "$REGISTRY/$IMAGE:$GITHUB_SHA" "$SVC"
            docker push "$REGISTRY/$IMAGE:$GITHUB_SHA"
            echo "::endgroup::"
          done

      - name: Record image tags + mirror main to the repo ArgoCD watches
        env:
          GITEA_CREDS: ${{ secrets.CIGITCREDS }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          export GIT_TRACE_CURL=0
          git config user.email "ci@orbstack.local"
          git config user.name  "orbstack-ci"

          # rewrite image+version inside exactly ONE top-level block of the
          # overlay: the block starts at "<key>:" and ends at the next
          # top-level key, so block order in the file no longer matters
          # (the previous per-key sed END markers silently overtook neighbours)
          bump() {
            awk -v key="$1" -v img="$2" -v ver="$GITHUB_SHA" '
              $0 ~ "^"key":" { inb = 1; print; next }
              inb && /^[^ #]/ { inb = 0 }
              inb && /^  image:/   { print "  image: " img; next }
              inb && /^  version:/ { print "  version: " ver; next }
              { print }
            ' helm-chart/values-orbstack.yaml > helm-chart/values-orbstack.yaml.tmp \
              && mv helm-chart/values-orbstack.yaml.tmp helm-chart/values-orbstack.yaml
          }
          for SVC in $SERVICES; do
            case $SVC in
              react-front) bump front      "$REGISTRY/grogu-front" ;;
              nodejs-back) bump nodejsBack "$REGISTRY/grogu-api" ;;
              golang-back) bump golangBack "$REGISTRY/golang-back" ;;
              rust-back)   bump rustBack   "$REGISTRY/rust-back" ;;
            esac
            echo "bumped $SVC -> $GITHUB_SHA"
          done

          # the bump lands in the ORBSTACK overlay — stage THAT file (the
          # shared values.yaml stays environment-neutral for lan/vps)
          git add helm-chart/values-orbstack.yaml
          git diff --cached --quiet || git commit -m "ci: images for $GITHUB_SHA [skip ci]"

          if [ "$MODE" = github ]; then
            git push "https://${GH_PAT}@github.com/${REPO}.git" HEAD:main
          else
            # everything (user commits AND the version bump) reaches ArgoCD:
            #   1) back to Gitea (the shared source of truth)
            git push "http://${GITEA_CREDS}@${GIT_HOST}/${REPO}.git" HEAD:main
            #   2) to the fast in-machine repo ArgoCD actually watches
            git push "git://${REGISTRY%%:*}:9418/gitops-origin.git" HEAD:main
          fi
