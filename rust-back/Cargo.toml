[package]
name = "rust-back"
version = "0.1.0"
edition = "2021"
description = "Click analytics service: consumes the Redis `clicks` stream into DuckDB and serves aggregations"

[dependencies]
anyhow = "1"
axum = "0.8"
duckdb = { version = "1", features = ["bundled"] }
prometheus = "0.13"
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
strip = true
